name: 投稿サンプル取得（書式確認用）

on:
  workflow_dispatch:
    inputs:
      count:
        description: "取得件数（5〜100）"
        default: "20"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: X から最新投稿を取得
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          SAMPLE_COUNT: ${{ inputs.count }}
        run: node scripts/fetch_sample.mjs
      - name: 結果をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/sample.json
          git diff --cached --quiet || git commit -m "投稿サンプルを取得"
          git push
