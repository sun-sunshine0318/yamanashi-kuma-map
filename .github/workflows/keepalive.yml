name: 自動更新の維持（月1回）

# 公開リポジトリは60日間更新がないと定期実行が止まるため、
# 投稿の少ない冬に備えて月1回、小さな記録ファイルを更新してコミットする。
on:
  schedule:
    - cron: "0 3 1 * *" # 毎月1日 12:00（日本時間）
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: 維持用の記録を更新してコミット
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.txt
          git commit -m "維持用コミット（自動更新を止めないため）"
          git pull --rebase
          git push
      - name: 失敗を Issue で知らせる
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create "自動更新エラー" --color D93F0B --description "自動更新の失敗" 2>/dev/null || true
          gh issue create --label "自動更新エラー" --title "維持用コミットが失敗しました" \
            --body "月1回の維持用コミットが失敗しました。このままだと60日後に自動更新が止まる可能性があります。実行結果：$RUN_URL"
