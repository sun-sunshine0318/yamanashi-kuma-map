name: 出没情報を更新

on:
  schedule:
    # 15分ごと。毎時0分・15分などはGitHub全体が混雑して実行が間引かれやすいので、少しずらしている
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      test_failure:
        description: "失敗通知のテスト（わざと失敗させてIssueが作られるか確認）"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

# 同時に2つ動いてデータがぶつからないようにする
concurrency:
  group: update-data
  cancel-in-progress: false

env:
  ALERT_LABEL: 自動更新エラー

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: 失敗通知のテスト
        if: ${{ inputs.test_failure }}
        run: |
          echo "::error::失敗通知のテストです（わざと失敗させています）"
          exit 1

      - name: X から新着投稿を取得
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: node scripts/fetch.mjs

      - name: 読み取り・座標変換して地図用データを作成
        run: node scripts/build.mjs

      - name: 変更があればコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "新しい投稿はありませんでした"
          else
            git commit -m "出没情報を更新"
            git pull --rebase
            git push
          fi

      # ---- 失敗したら Issue で知らせる（同じ Issue が開いている間は重ねて作らない） ----
      - name: 失敗を Issue で知らせる
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create "$ALERT_LABEL" --color D93F0B --description "自動更新の失敗" 2>/dev/null || true
          open=$(gh issue list --label "$ALERT_LABEL" --state open --json number --jq '.[0].number')
          if [ -n "$open" ]; then
            echo "すでに Issue #$open が開いているので新しくは作りません"
            exit 0
          fi
          gh issue create --label "$ALERT_LABEL" --title "自動更新が失敗しました" --body "$(cat <<EOF
          出没情報の自動更新が失敗しました。地図には、失敗する前のデータがそのまま表示されています。

          **実行結果：** $RUN_URL
          （赤い ✕ の付いた手順を開くと、エラーの内容が読めます）

          **よくある原因と対処**
          - \`HTTP 401\` / \`HTTP 403\` … X のトークンが無効になった可能性があります。X Developer Console で Bearer Token を作り直し、\`gh secret set X_BEARER_TOKEN\` で登録し直してください。
          - \`HTTP 402\` や「credits」を含むエラー … X API の従量課金クレジットが不足しています。X Developer Console で残高を確認してください。
          - \`HTTP 5xx\` や通信エラー … 一時的な障害のことが多く、次回以降の実行で自然に直ります。

          次に自動更新が成功したら、この Issue は自動で閉じられます。
          EOF
          )"

      - name: 復旧したら Issue を閉じる
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for n in $(gh issue list --label "$ALERT_LABEL" --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "自動更新が成功し、復旧しました（$RUN_URL）。"
          done
