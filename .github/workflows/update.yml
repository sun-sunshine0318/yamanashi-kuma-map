name: 出没情報を更新

on:
  schedule:
    # 主なタイマーは外部の cron-job.org（15分ごとに workflow_dispatch で起動）。
    # GitHub の定期実行は混雑で間引かれやすいため、1時間ごとの予備としてだけ残している。
    - cron: "52 * * * *"
  workflow_dispatch:
    inputs:
      test_failure:
        description: "失敗通知のテスト（わざと失敗させてIssueが作られるか確認）"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

# 同時に2つ動いてデータがぶつからないようにする
concurrency:
  group: update-data
  cancel-in-progress: false

env:
  ALERT_LABEL: 自動更新エラー

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: 失敗通知のテスト
        if: ${{ inputs.test_failure }}
        run: |
          echo "::error::失敗通知のテストです（わざと失敗させています）"
          exit 1

      # 片方の県が失敗しても、もう片方は更新できるよう、取得の失敗は最後にまとめて扱う
      - name: 山梨県：X から新着投稿を取得
        id: yamanashi
        continue-on-error: true
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: node scripts/fetch.mjs

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 長野県：公表資料（月別 PDF）を取得
        id: nagano
        continue-on-error: true
        run: |
          pip install --quiet --disable-pip-version-check pypdf==7.1.1
          python scripts/nagano.py

      - name: 読み取り・座標変換して地図用データを作成
        run: node scripts/build.mjs

      - name: 変更があればコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "新しい投稿はありませんでした"
          else
            git commit -m "出没情報を更新"
            git pull --rebase
            git push
          fi

      - name: 取得に失敗した県があれば失敗として扱う
        if: steps.yamanashi.outcome == 'failure' || steps.nagano.outcome == 'failure'
        run: |
          [ "${{ steps.yamanashi.outcome }}" = "failure" ] && echo "::error::山梨県（X）の取得に失敗しました"
          [ "${{ steps.nagano.outcome }}" = "failure" ] && echo "::error::長野県（公表資料）の取得に失敗しました"
          exit 1

      # ---- 失敗したら Issue で知らせる（同じ Issue が開いている間は重ねて作らない） ----
      - name: 失敗を Issue で知らせる
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create "$ALERT_LABEL" --color D93F0B --description "自動更新の失敗" 2>/dev/null || true
          open=$(gh issue list --label "$ALERT_LABEL" --state open --json number --jq '.[0].number')
          if [ -n "$open" ]; then
            echo "すでに Issue #$open が開いているので新しくは作りません"
            exit 0
          fi
          gh issue create --label "$ALERT_LABEL" --title "自動更新が失敗しました" --body "$(cat <<EOF
          出没情報の自動更新が失敗しました。地図には、失敗する前のデータがそのまま表示されています。

          **実行結果：** $RUN_URL
          （赤い ✕ の付いた手順を開くと、エラーの内容が読めます）

          **よくある原因と対処**
          - \`HTTP 401\` / \`HTTP 403\` … X のトークンが無効になった可能性があります。X Developer Console で Bearer Token を作り直し、\`gh secret set X_BEARER_TOKEN\` で登録し直してください。
          - \`HTTP 402\` や「credits」を含むエラー … X API の従量課金クレジットが不足しています。X Developer Console で残高を確認してください。
          - \`HTTP 5xx\` や通信エラー … 一時的な障害のことが多く、次回以降の実行で自然に直ります。
          - 「長野県のデータを取得できませんでした」… 長野県のページや PDF の書式が変わった可能性があります。読み取りルール（\`scripts/nagano.py\`）の見直しが必要です。片方の県が失敗しても、もう片方の県の更新は続きます。

          次に自動更新が成功したら、この Issue は自動で閉じられます。
          EOF
          )"

      - name: 復旧したら Issue を閉じる
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for n in $(gh issue list --label "$ALERT_LABEL" --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "自動更新が成功し、復旧しました（$RUN_URL）。"
          done
